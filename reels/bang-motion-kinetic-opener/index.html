<!doctype html>
<html lang="en">
<!-- Made with the Bang Motion skill - Kinetic Typography Opener for "What If" series -->
<head>
<meta charset="utf-8">
<title>What If — Series Opener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font display: Space Grotesk for tech feel, DM Sans for body -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>
<style>
:root{
  /* STYLE BRIEF — "What If" Series Brand */
  --accent:#FF6B35;      /* Brand orange from logo */
  --accent-lit:#FF9F7A;  /* Lighter orange for glow */
  --ink:#F0F0F0;         /* Near-white text */
  --base:#0A0A0F;        /* Deep near-black */
  --paper:#14141A;       /* Dark card background */
  --muted:#6B6B7A;       /* Muted secondary */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"DM Sans",system-ui,sans-serif;color:var(--ink)}
#filters{position:fixed;width:0;height:0;opacity:0;pointer-events:none}

/* Stage locked to 1080x1920 (vertical Shorts) */
#stage{position:fixed;left:50%;top:50%;width:1080px;height:1920px;
  transform:translate(-50%,-50%) scale(1);overflow:hidden;background:var(--base)}
#world{position:absolute;inset:0;will-change:transform}
#gl{position:absolute;inset:0;width:1080px;height:1920px;display:block}
.bgfx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(60% 40% at 50% 15%,
    color-mix(in srgb, var(--accent) 25%, transparent),
    color-mix(in srgb, var(--accent) 8%, transparent) 50%, transparent 80%)}
#dom{position:absolute;inset:0}

.scene{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;opacity:0;visibility:hidden}
.hero{opacity:0}
.hero-wrap{perspective:1400px}
.hero.sm{font-size:56px}.hero.md{font-size:72px}.hero.lg{font-size:96px}.hero.xl{font-size:120px;font-weight:700}
.txt2{display:inline-block;opacity:0}

/* Highlight variants (OPTIONAL - style brief chooses ONE form) */
.hl{position:relative;display:inline-block}
.hl i{position:absolute;transform:scaleX(0);transform-origin:0 50%}
.hl-t{position:relative;opacity:0}
/* PILL variant - our signature for this series */
.hl.pill{padding:.04em .28em .06em;border-radius:.3em}
.hl.pill i{inset:0;border-radius:inherit;background:linear-gradient(95deg,color-mix(in srgb,var(--accent) 85%,#000),var(--accent) 60%,var(--accent-lit))}
.hl.pill .hl-t{color:#0A0A0F}
.hl-orn{position:absolute;width:.5em;height:.5em;right:-.25em;top:-.28em;fill:var(--accent-lit);opacity:0}

/* Dark pocket under text for contrast */
.pocket{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(50% 40% at 50% 50%,rgba(0,0,0,.6),transparent 70%)}
.hero{font-size:120px;font-weight:700;letter-spacing:-.02em;color:#fff;
  white-space:nowrap;text-shadow:0 4px 40px rgba(0,0,0,.7)}
#line-a{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;will-change:transform,opacity,filter;opacity:0}

/* Light leak - top layer (lens flare style) */
.leak{position:absolute;left:50%;top:50%;width:2800px;height:2800px;
  margin:-1400px 0 0 -1400px;border-radius:50%;
  background:radial-gradient(circle,
    color-mix(in srgb, var(--accent-lit) 90%, white),
    color-mix(in srgb, var(--accent) 60%, transparent) 35%,
    transparent 75%);
  filter:blur(80px);mix-blend-mode:screen;opacity:0;pointer-events:none;z-index:40}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:10;
  background:radial-gradient(ellipse 80% 60% at 50% 55%,transparent 45%,
    rgba(0,0,0,.5) 80%,rgba(0,0,0,.95) 100%)}

/* Brand mark */
.brand-mark{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
  width:80px;height:80px;opacity:0;pointer-events:none}
.brand-mark svg{width:100%;height:100%}

/* Debug UI */
#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:11px 18px;border-radius:16px;
  background:rgba(14,16,22,.9);border:1px solid rgba(255,255,255,.1);
  font-size:13px;color:#A0A6B4;z-index:50}
#ui{display:none}
#ui.on{display:flex}
#ui button{background:#262A34;color:#fff;border:none;padding:8px 16px;
  border-radius:9px;font:inherit;cursor:pointer}
#scrub{width:340px;accent-color:var(--accent)}
#clock{font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right}
</style>
</head>
<body>

<svg id="filters"><defs></defs></svg>

<div id="stage">
  <div id="world">
    <canvas id="gl"></canvas>
    <div class="bgfx"></div>
    <div id="dom">
      <div class="pocket" id="pocket"></div>

      <!-- SCENE 1: Hook - "What If" (0-2.5s) -->
      <section class="scene" id="sc-hook"><div class="hero-wrap">
        <h1 class="hero xl" id="line-hook">
          <span class="txt">What</span>&nbsp;
          <span class="hl pill" id="hl-if"><i></i><span class="hl-t">If</span></span>
        </h1>
      </div></section>

      <!-- SCENE 2: Question - "Gravity Stopped" (2.5-5s) -->
      <section class="scene" id="sc-q1"><div class="hero-wrap">
        <h1 class="hero lg" id="line-q1">
          <span class="txt">Gravity</span>&nbsp;
          <span class="hl pill" id="hl-stopped"><i></i><span class="hl-t">stopped</span></span>&nbsp;
          <span class="txt">for</span>&nbsp;
          <span class="hl pill" id="hl-5sec"><i></i><span class="hl-t">5 seconds</span></span>
        </h1>
      </div></section>

      <!-- SCENE 3: Twist - "You float" (5-7.5s) -->
      <section class="scene" id="sc-twist"><div class="hero-wrap">
        <h1 class="hero lg" id="line-twist">
          <span class="txt">You</span>&nbsp;
          <span class="hl pill" id="hl-float"><i></i><span class="hl-t">float</span></span>&nbsp;
          <span class="txt">into</span>&nbsp;
          <span class="hl pill" id="hl-space"><i></i><span class="hl-t">space</span></span>
        </h1>
      </div></section>

      <!-- SCENE 4: Mechanism - "Atmosphere escapes" (7.5-10s) -->
      <section class="scene" id="sc-mech"><div class="hero-wrap">
        <h1 class="hero md" id="line-mech">
          <span class="txt">Atmosphere</span>&nbsp;
          <span class="hl pill" id="hl-escapes"><i></i><span class="hl-t">escapes</span></span>&nbsp;
          <span class="txt">instantly</span>
        </h1>
      </div></section>

      <!-- SCENE 5: Payoff - "Everything burns" (10-12.5s) -->
      <section class="scene" id="sc-payoff"><div class="hero-wrap">
        <h1 class="hero lg" id="line-payoff">
          <span class="txt">Everything</span>&nbsp;
          <span class="hl pill" id="hl-burns"><i></i><span class="hl-t">burns</span></span>&nbsp;
          <span class="txt">in</span>&nbsp;
          <span class="hl pill" id="hl-seconds"><i></i><span class="hl-t">seconds</span></span>
        </h1>
      </div></section>

      <!-- SCENE 6: Brand - Logo + "What If" (12.5-15s) -->
      <section class="scene" id="sc-brand"><div class="hero-wrap">
        <div class="brand-mark" id="brand-mark">
          <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="48" stroke="#FF6B35" stroke-width="4"/>
            <text x="50" y="62" text-anchor="middle" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#FF6B35">?</text>
          </svg>
        </div>
        <h1 class="hero md" id="line-brand">
          <span class="txt">What If</span>
        </h1>
      </div></section>

    </div>
  </div>
  <div class="leak" id="leak"></div>
  <div class="vignette"></div>
</div>

<div id="ui">
  <button id="btn-play">Pause</button><button id="btn-restart">Restart</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0.00s</span>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============ UTIL: split per char + directional motion blur ============ */
const $=(s,r=document)=>r.querySelector(s);
const defs=$('#filters defs'); let fc=0;
function makeBlur(){
  const id='mb'+(fc++), NS='http://www.w3.org/2000/svg';
  const f=document.createElementNS(NS,'filter'); f.id=id;
  f.setAttribute('x','-70%');f.setAttribute('y','-70%');
  f.setAttribute('width','240%');f.setAttribute('height','240%');
  const g=document.createElementNS(NS,'feGaussianBlur');
  g.setAttribute('stdDeviation','0 0'); f.appendChild(g); defs.appendChild(f);
  return {url:`url(#${id})`,node:g};
}
function blurTween(tl,targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){
  const b=makeBlur(),o={v:from};
  tl.set(targets,{filter:b.url},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){
    b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);
  tl.set(targets,{filter:'none'},at+dur);
}
const VERT={ax:.1,ay:1};
function splitChars(el){
  const words=(el.textContent||'').split(' '); el.textContent=''; const out=[];
  words.forEach((w,i)=>{
    const wr=document.createElement('span'); wr.className='wd';
    for(const c of w){const s=document.createElement('span');s.className='ch';
      s.textContent=c;wr.appendChild(s);out.push(s);}
    el.appendChild(wr);
    if(i<words.length-1){const sp=document.createElement('span');sp.className='ch';
      sp.innerHTML='&nbsp;';el.appendChild(sp);out.push(sp);}
  });
  return out;
}

/* ============ WEBGL WORLD (state-driven, no internal clock) ============ */
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ACC=new THREE.Color(cssVar('--accent')),ACL=new THREE.Color(cssVar('--accent-lit')),BASE=new THREE.Color(cssVar('--base'));
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(BASE.getHex(),.008);
const camera=new THREE.PerspectiveCamera(45,W/H,.1,400);

/* Particles: deterministic sinusoidal drift (no Math.random per frame) */
{const N=1800,pos=new Float32Array(N*3),seed=new Float32Array(N);
 for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*120;pos[i*3+1]=(Math.random()-.5)*200;
   pos[i*3+2]=-Math.random()*80+10;seed[i]=Math.random()*6.283;}
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
 var dustMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uOpacity:{value:.4},uPix:{value:Math.min(devicePixelRatio,2)},uColor:{value:ACL}},
  vertexShader:`attribute float aSeed;varying float vA;uniform float uTime;uniform float uPix;
   void main(){vec3 p=position;p.y+=sin(uTime*.25+aSeed)*1.2;
   vec4 mv=modelViewMatrix*vec4(p,1.);vA=.3+.7*abs(sin(uTime*.7+aSeed*2.8));
   gl_PointSize=(22.*uPix)/(-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;uniform float uOpacity;uniform vec3 uColor;
   void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;
   gl_FragColor=vec4(uColor,pow(1.-d*2.,2.2)*vA*uOpacity);}`});
 scene.add(new THREE.Points(g,dustMat));}

/* Geometric shapes orbiting (brand signature motion) */
const shapeGeo=new THREE.IcosahedronGeometry(1,0);
const shapeMat=new THREE.MeshStandardMaterial({color:ACC.getHex(),emissive:ACC.getHex(),
 emissiveIntensity:.4,roughness:.3,metalness:.15,transparent:true,opacity:0});
const SHAPES=[[-40,60,-50,12,.3,1.1],[55,40,-70,18,-.25,.9],[-60,-40,-45,10,.4,1.3],
 [50,-60,-55,15,-.35,1.2],[20,100,-80,8,.5,.8],[-30,-90,-60,14,-.15,1.4]];
const shapes=SHAPES.map(d=>{const m=new THREE.Mesh(shapeGeo,shapeMat.clone());
 m.position.set(d[0],d[1],d[2]);m.scale.setScalar(d[3]);m.userData={...d,ry:Math.random()*6.28,rx:Math.random()*6.28};
 scene.add(m);return m;});

/* Lighting */
scene.add(new THREE.AmbientLight(ACC.clone().multiplyScalar(.3).getHex(),1.2));
const key=new THREE.DirectionalLight(ACL.getHex(),2.2); key.position.set(30,40,50); scene.add(key);
const rim=new THREE.DirectionalLight(ACC.getHex(),1.5); rim.position.set(-20,-30,-40); scene.add(rim);

/* Composer with bloom */
const composer=new EffectComposer(renderer); composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.9,.6,.45);
composer.addPass(bloom); composer.addPass(new OutputPass());

/* Render function - pure function of timeline time */
function render(t){
  dustMat.uniforms.uTime.value=t; dustMat.uniforms.uOpacity.value=S.dust;
  shapes.forEach(m=>{
    const d=m.userData;
    m.material.opacity=S.shapesO;
    m.visible=S.shapesO>.01;
    m.rotation.y=t*d[4]+d[5];
    m.rotation.x=t*d[5]*.7+d.ry;
    m.position.y=d[1]+Math.sin(t*.3+d[5])*8;
  });
  const sh=S.shake;
  camera.position.set(S.camX+Math.sin(t*.35)*.3+Math.sin(t*127.3)*sh,
    S.camY+Math.cos(t*.28)*.2+Math.cos(t*103.7)*sh, S.camZ);
  camera.lookAt(S.camX*.3,S.camY*.3,0); camera.rotation.z+=S.camRoll;
  bloom.strength=S.bloom;
  composer.render();
}

/* ============ STATE OBJECT (single source of truth for WebGL) ============ */
const S={ grid:0, dust:.4, shapesO:0, camX:0,camY:0,camZ:28,camRoll:0,
          bloom:.9, shake:0, heroO:0,heroS:1,heroX:0,heroY:0,heroZ:0 };

/* ============ TIMELINE ============ */
const Q=new URLSearchParams(location.search);
const DURATION=15.0;  // 15 second opener
const tl=gsap.timeline({paused:true});
const rig=$('#world'), leak=$('#leak');

/* ---- TRANSITIONS ---- */
let leakSide=1;
const sweep=(at,dur=1.0)=>{ const side=(leakSide*=-1);
  tl.fromTo(leak,{x:side*1800,y:-300,scale:.8},
    {x:side*400,y:200,scale:1.2,duration:dur,ease:'sine.out',immediateRender:false},at);
  tl.fromTo(leak,{opacity:0},{opacity:.9,duration:dur*.35,ease:'sine.in',immediateRender:false},at);
  tl.to(leak,{opacity:0,duration:dur*.65,ease:'sine.out'},at+dur*.35); };

const camThrough=(atCut,{push=1.8,from=1.4,inDur=.45,outDur=.85,
                         oOut='50% 50%',oIn='50% 50%'}={})=>{
  tl.set(rig,{transformOrigin:oOut},atCut-inDur);
  tl.to(rig,{scale:push,duration:inDur,ease:'power2.in'},atCut-inDur);
  tl.set(rig,{transformOrigin:oIn,scale:from},atCut);
  tl.to(rig,{scale:1,duration:outDur,ease:'power3.out'},atCut); };

const breathe=(from,to,{z0=1,z1=1.03,origin='50% 50%'}={})=>{
  tl.set(rig,{transformOrigin:origin},from);
  tl.fromTo(rig,{scale:z0},{scale:z1,duration:to-from,ease:'sine.inOut',immediateRender:false},from); };

/* ---- TEXT ENTRANCE DOORS (pick per meaning, never repeat adjacent) ---- */
const inUp   =(ch,el,at,{dur=.7,st=.022}={})=>{tl.fromTo(ch,{opacity:0,yPercent:55,scaleY:1.4},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(tl,el,at,28,0,dur,VERT);};
const inDown =(ch,el,at,{dur=.7,st=.022}={})=>{tl.fromTo(ch,{opacity:0,yPercent:-55,scaleY:1.4},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(tl,el,at,28,0,dur,VERT);};
const inLeft =(ch,el,at,{dur=.65,st=.018}={})=>{tl.fromTo(ch,{opacity:0,xPercent:-40},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(tl,el,at,45,0,dur,{ease:'power4.out'});};
const inRight=(ch,el,at,{dur=.65,st=.018}={})=>{tl.fromTo(ch,{opacity:0,xPercent:40},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:{each:st,from:'end'},immediateRender:false},at);blurTween(tl,el,at,45,0,dur,{ease:'power4.out'});};
const inDepth=(ch,el,at,{dur=.9,st=.016}={})=>{tl.fromTo(ch,{opacity:0,scale:2.2},{opacity:1,scale:1,duration:dur,ease:'expo.out',stagger:{each:st,from:'center'},immediateRender:false},at);blurTween(tl,el,at,20,0,dur,{ease:'expo.out',ax:1,ay:1});};
const inMask =(ch,el,at,{dur=.85,from='left'}={})=>{const c={left:'inset(0% 100% 0% 0%)',right:'inset(0% 0% 0% 100%)',up:'inset(100% 0% 0% 0%)',down:'inset(0% 0% 100% 0%)'}[from];
  tl.set(ch,{opacity:1,xPercent:0,yPercent:0,scale:1,scaleY:1},at);
  tl.fromTo(el,{clipPath:c},{clipPath:'inset(0% 0% 0% 0%)',duration:dur,ease:'power3.inOut',immediateRender:false},at);
  tl.set(el,{clipPath:'none'},at+dur);};
const inWords=(ch,el,at,{dur=.55,st=.12}={})=>{const w=el.querySelectorAll('.wd');
  tl.set(ch,{opacity:1,xPercent:0,yPercent:0,scale:1,scaleY:1},at);
  tl.fromTo(w,{opacity:0,yPercent:35,rotateX:-50},{opacity:1,yPercent:0,rotateX:0,duration:dur,ease:'back.out(1.5)',stagger:st,immediateRender:false},at);};

const outUp   =(ch,el,at,{dur=.35,st=.008}={})=>{tl.to(ch,{opacity:0,yPercent:-65,duration:dur,ease:'power2.in',stagger:st},at);blurTween(tl,el,at,0,40,dur+.1,{ease:'power2.in',...VERT});};
const outDown =(ch,el,at,{dur=.35,st=.008}={})=>{tl.to(ch,{opacity:0,yPercent:65,duration:dur,ease:'power2.in',stagger:st},at);blurTween(tl,el,at,0,40,dur+.1,{ease:'power2.in',...VERT});};
const outLeft =(ch,el,at,{dur=.35,st=.008}={})=>{tl.to(ch,{opacity:0,xPercent:-55,duration:dur,ease:'power2.in',stagger:st},at);blurTween(tl,el,at,0,50,dur+.1,{ease:'power2.in'});};
const outRight=(ch,el,at,{dur=.35,st=.008}={})=>{tl.to(ch,{opacity:0,xPercent:55,duration:dur,ease:'power2.in',stagger:{each:st,from:'end'}},at);blurTween(tl,el,at,0,50,dur+.1,{ease:'power2.in'});};
const outDepth=(ch,el,at,{dur=.45,st=.007}={})=>{tl.to(ch,{opacity:0,scale:2.4,duration:dur,ease:'power2.in',stagger:{each:st,from:'center'}},at);blurTween(tl,el,at,0,28,dur+.1,{ease:'power2.in',ax:1,ay:1});};

const mark=(hl,at)=>{const i=$('i',hl);if(i)tl.fromTo(i,{scaleX:0},{scaleX:1,duration:.45,ease:'power3.out',immediateRender:false},at);
  tl.fromTo($('.hl-t',hl),{opacity:0,yPercent:50},{opacity:1,yPercent:0,duration:.6,ease:'power4.out',immediateRender:false},at);
  const orn=$('.hl-orn',hl);if(orn)tl.fromTo(orn,{opacity:0,scale:.2,rotate:-35},{opacity:1,scale:1,rotate:0,duration:.45,ease:'back.out(1.8)',immediateRender:false},at+.18);};
const popDot=(el,at)=>tl.fromTo(el,{opacity:0,yPercent:50},{opacity:1,yPercent:0,duration:.45,ease:'power4.out',immediateRender:false},at);

/* Brand mark animation */
const brandIn=(el,at)=>{tl.fromTo(el,{opacity:0,scale:.5,rotate:-180},{opacity:1,scale:1,rotate:0,duration:1.2,ease:'elastic.out(1, .5)',immediateRender:false},at);};
const brandOut=(el,at)=>{tl.to(el,{opacity:0,scale:.6,rotate:90,duration:.6,ease:'power2.in'},at);};

/* ---- INITIAL STATE ---- */
tl.set(S,{dust:.35,shapesO:0,camZ:26,bloom:.85},0);
breathe(0,DURATION);

/* ================= RUNDOWN (from concept) =================
Concept: "What If" Series Kinetic Opener
Scenes: 6 | Duration: 15s | Ratio: 9:16 (1080x1920)
Palette: #FF6B35 / #0A0A0F / #FF9F7A | Font: Space Grotesk + DM Sans
Background: Particle field + orbiting geo shapes (breathing camera)
Transitions: Sweep light-leak + camThrough on key beats
Signature: Pill highlight on key words, orbiting shapes as motion signature
============================================================== */

// SCENE 1: Hook "What If" (0 - 2.5s)
{
  const sc=$('#sc-hook'), el=$('#line-hook');
  const ch=splitChars($('.txt',el));
  tl.set([sc,el],{autoAlpha:1},0);
  inDepth(ch,el,0.15);
  mark($('#hl-if'),0.5);
  tl.to(S,{shapesO:.6,duration:1.2,ease:'power2.out'},0.2);
  outDepth(ch,el,2.0);
  tl.to(S,{shapesO:0,duration:.6,ease:'power2.in'},2.1);
}

// TRANSITION 1: Sweep + camThrough (2.0 - 2.5s)
sweep(2.0, 1.1);
camThrough(2.45, {push:1.7, from:1.35, inDur:.4, outDur:.8});

// SCENE 2: "Gravity stopped for 5 seconds" (2.5 - 5.0s)
{
  const sc=$('#sc-q1'), el=$('#line-q1');
  const ch=splitChars($('.txt',el));
  tl.set([sc,el],{autoAlpha:1},2.5);
  inUp(ch,el,2.6);
  mark($('#hl-stopped'),3.0);
  mark($('#hl-5sec'),3.4);
  tl.to(S,{shapesO:.5,duration:1,ease:'power2.out'},2.7);
  outUp(ch,el,4.6);
  tl.to(S,{shapesO:0,duration:.5,ease:'power2.in'},4.7);
}

// TRANSITION 2: Sweep (4.6 - 5.1s)
sweep(4.6, 1.0);
camThrough(5.0, {push:1.6, from:1.3, inDur:.35, outDur:.75});

// SCENE 3: "You float into space" (5.0 - 7.5s)
{
  const sc=$('#sc-twist'), el=$('#line-twist');
  const ch=splitChars($('.txt',el));
  tl.set([sc,el],{autoAlpha:1},5.1);
  inLeft(ch,el,5.2);
  mark($('#hl-float'),5.6);
  mark($('#hl-space'),6.0);
  tl.to(S,{shapesO:.7,camZ:22,duration:1.2,ease:'power2.out'},5.3);
  outLeft(ch,el,7.1);
  tl.to(S,{shapesO:0,camZ:26,duration:.6,ease:'power2.in'},7.2);
}

// TRANSITION 3: Sweep (7.1 - 7.6s)
sweep(7.1, 1.0);
camThrough(7.5, {push:1.8, from:1.4, inDur:.4, outDur:.8});

// SCENE 4: "Atmosphere escapes instantly" (7.5 - 10.0s)
{
  const sc=$('#sc-mech'), el=$('#line-mech');
  const ch=splitChars($('.txt',el));
  tl.set([sc,el],{autoAlpha:1},7.6);
  inRight(ch,el,7.7);
  mark($('#hl-escapes'),8.1);
  tl.to(S,{shapesO:.8,dust:.7,duration:1,ease:'power2.out'},7.8);
  outRight(ch,el,9.6);
  tl.to(S,{shapesO:0,dust:.35,duration:.5,ease:'power2.in'},9.7);
}

// TRANSITION 4: Stronger sweep (9.6 - 10.1s)
sweep(9.6, 1.1);
camThrough(10.0, {push:2.0, from:1.5, inDur:.45, outDur:.9});

// SCENE 5: "Everything burns in seconds" (10.0 - 12.5s)
{
  const sc=$('#sc-payoff'), el=$('#line-payoff');
  const ch=splitChars($('.txt',el));
  tl.set([sc,el],{autoAlpha:1},10.1);
  inDepth(ch,el,10.2);
  mark($('#hl-burns'),10.6);
  mark($('#hl-seconds'),11.0);
  tl.to(S,{shapesO:1,bloom:1.2,shake:.03,duration:1.2,ease:'power2.out'},10.3);
  outDepth(ch,el,12.1);
  tl.to(S,{shapesO:0,bloom:.85,shake:0,duration:.6,ease:'power2.in'},12.2);
}

// TRANSITION 5: Final sweep to brand (12.1 - 12.6s)
sweep(12.1, 1.0);

// SCENE 6: Brand mark + "What If" (12.5 - 15.0s)
{
  const sc=$('#sc-brand'), markEl=$('#brand-mark'), el=$('#line-brand');
  const ch=splitChars($('.txt',el));
  tl.set([sc,el],{autoAlpha:1},12.6);
  brandIn(markEl,12.5);
  inMask(ch,el,12.8,{from:'up'});
  // Hold brand to end
}

tl.to({},{duration:.01},DURATION);

/* ============ DEMO MODE (catalog of doors) ============ */
if(Q.has('demo')){
  tl.clear(); tl.pause();
  const sc=$('#sc-hook'), el=$('#line-hook'), ch=splitChars($('.txt',el));
  tl.set([sc,el],{autoAlpha:1},0);
  let t=.3;
  for(const [pin,pout] of [[inUp,outUp],[inDown,outDown],[inLeft,outLeft],[inRight,outRight],[inDepth,outDepth]]){
    pin(ch,el,t); pout(ch,el,t+1.1); t+=1.6; }
  inMask(ch,el,t); outDepth(ch,el,t+1.1); t+=1.5;
  inWords(ch,el,t); outUp(ch,el,t+1.2);
  tl.to({},{duration:.01},t);
}

/* ============ RUNTIME ============ */
const stage=$('#stage');
const fit=()=>{const s=Math.min(innerWidth/1080,innerHeight/1920);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit); fit();

const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');
let scrubbing=false;
(function frame(){ const t=tl.time(); render(t);
  clock.textContent=t.toFixed(2)+'s';
  if(!scrubbing)scrub.value=String(t/DURATION*1000);
  requestAnimationFrame(frame); })();

const toggle=()=>{ if(tl.paused()||tl.progress()>=1){
    if(tl.progress()>=1)tl.progress(0); tl.play(); btn.textContent='Pause';}
  else{tl.pause();btn.textContent='Play';} };
btn.onclick=toggle;
$('#btn-restart').onclick=()=>{tl.pause(0);tl.play();btn.textContent='Pause';};
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();}
  if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();}
  if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on'); });
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>{tl.play(0);});

const seek=t=>{tl.pause();tl.time(t,false);if(gsap.ticker.tick)gsap.ticker.tick();render(t);};
window.OPENER={tl,DURATION,seek,ready:false};
document.fonts.ready.then(()=>{window.OPENER.ready=true;if(!Q.has('clean'))tl.play(0);});
</script>
</body>
</html>
