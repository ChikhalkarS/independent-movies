<!doctype html>
<html lang="en">
<!-- Untold Epic — Brahmastra | bang-motion explainer | 1080×1920 vertical -->
<head>
<meta charset="utf-8">
<title>Untold Epic — Brahmastra</title>
<!--
  STYLE BRIEF (from style-brief.md):
  - Tema: Brahmastra WMD paralel Oppenheimer/atom
  - Perasaan: Awe, Dread, Reverence
  - Palet: Gold #E8B84D, Cyan #00FFFF, BlueWhite #E8F4FF, BloodRed #8B0000, Ochre #986928, ShieldGold #FFD700, AshGrey #3D3D3D
  - Font Display: Cinzel (serif monumental), IBM Plex Sans (grotesk), Noto Sans Devanagari (glyph)
  - Latar: Grainy Gradient (BloodRed→#1A0505 radial + Cyan/BlueWhite blob + noise)
  - Gerak Latar: Blob berputar pelan + partikel naik + kamera dolly ke lubang gradien
  - Tanda Tangan: Push-through ke elemen yang bercerita
  - Render: Glossy emas + Neon garis untuk glyph/blueprint
  - Transisi: Push-through, Cut keras, Whip, Match-cut
  - Momen Istimewa: Ledakan 30-34s (volume glow, bass drop, shockwave)
-->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IBM+Plex+Sans:wght@500;700&family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#E8B84D; --gold-dim:#B88C3A; --cyan:#00FFFF; --cyan-dim:#00AAAA;
  --bluewhite:#E8F4FF; --blood:#8B0000; --blood-dim:#5A0000; --ochre:#986928; --ochre-dim:#6B4A1C;
  --shield:#FFD700; --ash:#3D3D3D; --ink:#1A0A0A; --paper:#F4E9D3;
  --accent:#E8B84D; --accent-lit:#FFF3C0;
}
html,body{margin:0;height:100%;background:#0a0505;overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--blood);
  font-family:'IBM Plex Sans',system-ui,sans-serif;color:#fff}
#stage svg{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}
.view{position:absolute;inset:0}
.view.off{visibility:hidden}
.big{font-family:'Cinzel',serif;font-weight:900}
#ui{position:absolute;inset:0;pointer-events:none}
.kick{font-family:'Cinzel',serif;font-weight:700;font-size:48px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.line{font-family:'Cinzel',serif;font-weight:500;color:#fff;white-space:nowrap;opacity:0}
.line.sm{font-size:56px}.line.md{font-size:72px}.line.lg{font-size:96px}.line.xl{font-size:120px;font-weight:700;letter-spacing:-.02em}
.line.ink{color:var(--ink);text-shadow:none}
.w{display:inline-block;white-space:nowrap;opacity:0;will-change:transform,opacity,filter}
.hl{position:relative;display:inline-block}
.hl i{position:absolute;inset:0;border-radius:inherit;transform:scaleX(0);transform-origin:0 50%;z-index:-1}
.txt2{display:inline-block;opacity:0}
.name{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:36px;letter-spacing:.1em;color:var(--gold);opacity:0;white-space:nowrap}
.glyph{font-family:'Noto Sans Devanagari',sans-serif;font-weight:700;color:var(--cyan)}
.anno *{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 70% at 50% 45%,transparent 50%,rgba(26,5,5,.6) 100%)}
/* grainy gradient base — injected by JS */
/* panel debug: ?debug=1 */
#dbg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;
  background:rgba(14,16,22,.9);color:#cfd5e3;font:13px system-ui;z-index:50}
#dbg input{width:360px}#dbg span{font-variant-numeric:tabular-nums;min-width:6ch}
</style>
</head>
<body>
<svg id="filters"><defs></defs></svg>
<div id="stage">
  <!-- VIEW: single continuous world (mode aliran) -->
  <div id="side" class="view"><svg viewBox="0 0 1080 1920"><g id="sideCam">
    <!-- grainy gradient background -->
    <rect id="bgBase" x="-200" y="-200" width="1480" height="2320" fill="var(--blood)"/>
    <g id="bgBlobs"></g>
    <g id="particles"></g>

    <!-- Brahmastra shaft (hero) - world coords -->
    <g id="brahmastra">
      <!-- shaft -->
      <rect id="shaft" x="-4" y="-300" width="8" height="600" fill="url(#shaftGrad)"/>
      <!-- tip -->
      <path id="tip" d="M0 -315 L-12 -300 L12 -300 Z" fill="var(--gold)"/>
      <!-- fletching -->
      <path id="fletch" d="M0 310 L-18 290 L18 290 Z" fill="var(--gold-dim)"/>
      <!-- glyphs along shaft -->
      <g id="glyphs"></g>
      <!-- plasma core -->
      <circle id="core" cx="0" cy="10" r="0" fill="url(#coreGrad)"/>
      <!-- shield dome -->
      <circle id="shield" cx="0" cy="10" r="0" fill="none" stroke="var(--shield)" stroke-width="3" opacity="0"/>
      <!-- shockwave ring -->
      <circle id="shockwave" cx="0" cy="10" r="0" fill="none" stroke="var(--shield)" stroke-width="4" opacity="0"/>
    </g>

    <!-- floating manuscripts / blueprints -->
    <g id="manuscripts"></g>
    <g id="blueprints"></g>

    <!-- battlefield ground -->
    <rect x="-200" y="1300" width="1480" height="700" fill="var(--ochre)"/>
    <g id="battlefieldDebris"></g>

    <!-- distant mountains -->
    <path id="mountains" d="M-200 1300
      C200 1250 400 1280 600 1260
      C800 1240 1000 1270 1280 1250
      L1480 2000 L-200 2000 Z" fill="#0A0303"/>
  </g></svg></div>

  <!-- UI layer: text blocks that appear AFTER camera settles -->
  <div id="ui">
    <!-- Hook: Oppenheimer quote -->
    <div class="top" id="txtHook" style="top:180px;left:80px;right:80px;text-align:center">
      <div class="line xl" style="color:var(--gold);font-weight:700" id="hookLine">
        <span class="w">Oppenheimer</span><span class="w">didn't</span><span class="w">invent</span>
        <span class="w">the</span><span class="w">deadliest</span><span class="w">weapon...</span>
        <span class="w">he</span><span class="w">read</span><span class="w">about</span><span class="w">it.</span>
      </div>
    </div>

    <!-- Scene labels -->
    <div class="top" id="txtLabel" style="top:180px;left:80px;right:80px;text-align:center;opacity:0">
      <div class="kick" id="labelKick"></div>
      <div class="line md" id="labelLine"></div>
    </div>

    <!-- Glyph close-up labels -->
    <div class="top" id="txtGlyph" style="top:1400px;left:60px;right:60px;text-align:center;opacity:0">
      <div class="line sm" id="glyphLine"></div>
    </div>
  </div>

  <div id="vig"></div>
  <div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
</div>

<!-- VO: user will provide via caption-skill; src filled at runtime -->
<audio id="vo" src="" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const W=1080,H=1920,DUR=60;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)], NS='http://www.w3.org/2000/svg';
function S(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const mod=(a,n)=>((a%n)+n)%n, clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t, smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
const TAU=Math.PI*2;
const rng=(seed)=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}};
const rnd=rng(42); // single deterministic RNG
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- motion blur berarah (feGaussianBlur x/y terpisah) ---------- */
const defs=$('#filters defs');let fc=0;
function makeBlur(){const id='mb'+(fc++);const f=document.createElementNS(NS,'filter');f.id=id;
  f.setAttribute('x','-70%');f.setAttribute('y','-70%');f.setAttribute('width','240%');f.setAttribute('height','240%');
  const g=document.createElementNS(NS,'feGaussianBlur');g.setAttribute('stdDeviation','0 0');f.appendChild(g);defs.appendChild(f);return {url:`url(#${id})`,node:g};}
function blurTween(tl,targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){const b=makeBlur(),o={v:from};tl.set(targets,{filter:b.url},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);tl.set(targets,{filter:'none'},at+dur);}
const VERT={ax:.1,ay:1},HORZ={ax:1,ay:.08};

/* ---------- split kalimat per kata ---------- */
$$('.line').forEach(el=>{const out=[];el.childNodes.forEach(n=>{if(n.nodeType===3){n.textContent.split(/\s+/).filter(Boolean).forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;out.push(s);});}else{const s=document.createElement('span');s.className='w';s.appendChild(n.cloneNode(true));out.push(s);}});el.textContent='';out.forEach(s=>el.appendChild(s));});

/* ---------- gradient backgrounds & glow defs ---------- */
(function(){
  // shaft gradient
  const g=S('linearGradient',{id:'shaftGrad',x1:'0%',y1:'0%',x2:'100%',y2:'0%'},defs);
  S('stop',{offset:'0%','stop-color':'var(--gold-dim)'},g);S('stop',{offset:'50%','stop-color':'var(--gold)'},g);S('stop',{offset:'100%','stop-color':'var(--gold-dim)'},g);
  // core gradient
  const cg=S('radialGradient',{id:'coreGrad',cx:'50%',cy:'50%',r:'50%'},defs);
  S('stop',{offset:'0%','stop-color':'var(--bluewhite)'},cg);S('stop',{offset:'40%','stop-color':'var(--cyan)'},cg);S('stop',{offset:'100%','stop-color':'var(--cyan)','stop-opacity':'0'},cg);
  // bg blob gradient
  const bg=S('radialGradient',{id:'bgBlob',cx:'50%',cy:'40%',r:'70%'},defs);
  S('stop',{offset:'0%','stop-color':'var(--cyan)','stop-opacity':'0.15'},bg);S('stop',{offset:'60%','stop-color':'var(--bluewhite)','stop-opacity':'0.05'},bg);S('stop',{offset:'100%','stop-color':'var(--blood)','stop-opacity':'0'},bg);
  // glow filter for glyphs
  const glow=S('filter',{id:'glyphGlow',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);
  S('feGaussianBlur',{stdDeviation:'8','result':'blur'},glow);S('feMerge',{innerHTML:'<feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/>'},glow);
})();

/* ---------- Brahmastra glyphs (Devanagari-like paths) ---------- */
const glyphPaths=[
  "M0 -28 L0 18 M-14 -28 L14 -28 M-8 -4 L8 -4 M-5 14 L0 18 L5 14",  // Om-like
  "M0 -28 L0 18 M-14 -22 L14 -22 M-10 2 L10 2 M-6 12 L6 12",          // Brahma
  "M0 -28 L0 18 M-12 -26 L12 -26 M-12 -6 L12 -6 M-8 10 L8 10",        // Astra
  "M0 -28 L0 18 M-15 -24 L15 -24 M-10 0 L10 0 M-6 15 L6 15",          // weapon
  "M0 -28 L0 18 M-12 -20 L12 -20 M-10 -2 L10 -2 M-8 14 L8 14",        // fire
  "M0 -28 L0 18 M-10 -24 L10 -24 M-8 -8 L8 -8 M-6 10 L6 10",          // energy
  "M0 -28 L0 18 M-14 -22 L14 -22 M-10 4 L10 4 M-7 16 L7 16",          // power
  "M0 -28 L0 18 M-13 -25 L13 -25 M-9 -5 L9 -5 M-5 12 L5 12",          // destruction
  "M0 -28 L0 18 M-11 -23 L11 -23 M-7 -2 L7 -2 M-4 15 L4 15",          // shield
  "M0 -28 L0 18 M-12 -21 L12 -21 M-8 2 L8 2 M-5 13 L5 13",            // contained
  "M0 -28 L0 18 M-10 -26 L10 -26 M-6 -10 L6 -10 M-3 14 L3 14",        // reset
  "M0 -28 L0 18 M-13 -24 L13 -24 M-9 -3 L9 -3 M-6 11 L6 11"           // loop
];

/* ---------- particle system ---------- */
class Particles{
  constructor(){this.list=[];}
  emit(x,y,o={}){
    const {n=1,c='var(--cyan)',spd=20,spr=TAU,life=1.5,sz=2,grav=0}=o;
    for(let i=0;i<n;i++){const a=o.dir!==undefined?o.dir+(rnd()-.5)*spr:rnd()*TAU;
      this.list.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,c,life,maxLife:life,sz,grav,a:1});}
  }
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){const p=this.list[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt;p.a=p.life/p.maxLife;
      if(p.life<=0)this.list.splice(i,1);}
  }
  draw(ctx){
    for(const p of this.list){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.a,0,TAU);ctx.fill();}ctx.globalAlpha=1;}
}

/* ---------- text helpers ---------- */
const words=el=>$$('.w',el);
const say=(sel,at,{dur=.55,st=.08,mode='up'}={})=>{const el=$(sel),ws=words(el);tl.set(el,{opacity:1},at);
  if(mode==='scale')tl.fromTo(ws,{opacity:0,scale:.7,rotate:-3},{opacity:1,scale:1,rotate:0,duration:dur,ease:'back.out(1.6)',stagger:st,immediateRender:false},at);
  else tl.fromTo(ws,{opacity:0,yPercent:60,scaleY:1.25},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);
  blurTween(tl,el,at,22,0,dur+st*ws.length,VERT);
  $$('.hl i',el).forEach((h,i)=>tl.fromTo(h,{scaleX:0},{scaleX:1,duration:.4,ease:'power3.out',immediateRender:false},at+st*ws.length+.2+i*.2));};
const unsay=(sel,at,{dur=.3}={})=>{const el=$(sel),ws=words(el);tl.to(ws,{opacity:0,yPercent:-50,duration:dur,ease:'power2.in',stagger:.02},at);
  blurTween(tl,el,at,0,30,dur+.1,{ease:'power2.in',...VERT});tl.set(el,{opacity:0},at+dur+.15);};
const fadeUp=(at,sel)=>tl.fromTo(sel,{opacity:0,y:30,filter:'blur(6px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.5,ease:'power3.out'},at);
const fadeOut=(at,sel)=>tl.to(sel,{opacity:0,y:-30,filter:'blur(8px)',duration:.35,ease:'power2.in'},at);

/* ---------- fly in for assets (manuscripts, blueprints) ---------- */
function flyIn(sel,at,{from='left',dur=.9}={}){
  const dx=from==='left'?-300:from==='right'?300:0, dy=from==='top'?-200:from==='bottom'?200:0, rot=from==='left'?-8:from==='right'?8:0;
  tl.fromTo(sel,{opacity:0,x:dx,y:dy,rotation:rot,filter:'blur(14px)'},{opacity:1,x:0,y:0,rotation:0,filter:'blur(0px)',duration:dur,ease:'power4.out'},at);
  tl.to(sel,{y:'-=25',rotation:'+=1.5',scale:1.02,duration:1.5,yoyo:true,repeat:-1,ease:'sine.inOut'},at+dur);
}

/* ---------- main timeline ---------- */
const tl=gsap.timeline({paused:true});

/* ---------- manuscripts & blueprints ---------- */
const manuscripts=[],blueprints=[];
for(let i=0;i<6;i++){
  manuscripts.push({angle:(i/6)*TAU,rStart:280,rEnd:200,rot:(rnd()-.5)*.4,page:0});
}
for(let i=0;i<12;i++){
  blueprints.push({angle:(i/12)*TAU,r:180+(i%3)*50,spd:.4+(i%2)*.3,len:100});
}

/* ---------- camera rig ---------- */
const C={x:540,y:960,z:1}; // world center at shaft base-ish
const sideCam=$('#sideCam');
function applyCam(){sideCam.setAttribute('transform',`translate(${540-C.x*C.z}px,${960-C.y*C.z}px) scale(${C.z})`);}
const look=(at,x,y,z,dur=1.6,ease='sine.inOut')=>tl.to(C,{x,y,z,duration:dur,ease,onUpdate:applyCam},at);
const home=(at,dur=1.2)=>look(at,540,960,1,dur,'power2.inOut');
const into=(cutAt,x,y,z)=>tl.to(C,{x,y,z,duration:.9,ease:'power2.in',onUpdate:applyCam},cutAt-.9);
const settle=(cutAt,x,y,z)=>tl.to(C,{x,y,z:z*.94,duration:1.1,ease:'power3.out',onUpdate:applyCam},cutAt);
const breath=(a,b,z)=>tl.to(C,{z,duration:b-a,ease:'sine.inOut',onUpdate:applyCam},a);

/* ---------- particle system ---------- */
const particles=new Particles();

/* ---- SHOT 1: 0-4s - Hook: Glyphs idle ---- */
tl.set(C,{x:540,y:960,z:1.5,onUpdate:applyCam},0); // close on shaft
// glyphs appear
for(let i=0;i<12;i++){
  const g=S('path',{d:glyphPaths[i],stroke:'var(--cyan)','stroke-width':2.5,fill:'none','stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#glyphGlow)'},$('#glyphs'));
  g.setAttribute('transform',`translate(0,${-250+i*50})`);
  tl.fromTo(g,{opacity:0,strokeDashoffset:300},{opacity:1,strokeDashoffset:0,duration:.8,ease:'power3.out'},i*.15);
}
breath(0,4,1.02); // subtle camera breath

/* ---- SHOT 2: 4-8s - Glyphs pulse accelerate + Hook text ---- */
tl.to('#hookLine',{opacity:1,duration:.1},4);
say('#hookLine',4.2,{dur:.6,st:.04,mode:'scale'});
breath(4,8,1.03);

/* ---- SHOT 3: 8-13s - Manuscripts morph to blueprints ---- */
tl.to('#hookLine',{opacity:0,duration:.3},8);
fadeUp(8.5,'#txtLabel');
tl.to('#labelKick',{textContent:'Ancient Text → Blueprint',duration:0},8.5);
tl.to('#labelLine',{textContent:'Sanskrit manuscripts lift off the page',duration:0},8.5);
fadeUp(9,'#labelLine');
// manuscripts fly in
for(let i=0;i<6;i++){
  const m=S('g',{transform:`translate(0,0)`},$('#manuscripts'));
  const page=S('rect',{x:-80,y:-100,width:160,height:200,rx:8,fill:'var(--paper)',stroke:'var(--ochre)','stroke-width':2},m);
  S('text',{x:0,y:-60,'text-anchor':'middle','font-family':'"Noto Sans Devanagari"','font-size':28,fill:'var(--ink)'},m).textContent='ॐ ब्रह्मास्त्र';
  S('line',{x1:-60,y1:-20,x2:60,y2:-20,stroke:'var(--cyan)','stroke-width':2},m);
  S('line',{x1:-60,y1:20,x2:60,y2:20,stroke:'var(--cyan)','stroke-width':2},m);
  S('line',{x1:-60,y1:60,x2:60,y2:60,stroke:'var(--cyan)','stroke-width':2},m);
  const a=manuscripts[i].angle, r=manuscripts[i].rStart;
  m.setAttribute('transform',`translate(${540+Math.cos(a)*r} ${960+Math.sin(a)*r*0.6}) rotate(${manuscripts[i].rot})`);
  flyIn(m,8.5+ i*.3,{from:i%2?'right':'left'});
}
look(10,540,800,1.3,1.5); // camera pulls back to show orbit
breath(8,13,1.01);

/* ---- SHOT 4: 13-18s - Blueprints orbit ---- */
fadeOut(13,'#txtLabel');
fadeUp(13.5,'#txtLabel');
tl.to('#labelKick',{textContent:'Blueprints Orbit',duration:0},13.5);
tl.to('#labelLine',{textContent:'Technical schematics converge on the weapon',duration:0},13.5);
fadeUp(14,'#labelLine');
// blueprints
for(let i=0;i<12;i++){
  const b=S('g',{},$('#blueprints'));
  S('line',{x1:-60,y1:0,x2:60,y2:0,stroke:'var(--cyan)','stroke-width':1.5},b);
  for(let t=0;t<5;t++) S('line',{x1:-60+t*30,y1:-5,x2:-60+t*30,y2:5,stroke:'var(--cyan)','stroke-width':1},b);
  blueprints[i].el=b;
}
look(14,540,900,1.2,1.2);
breath(13,18,1.01);

/* ---- SHOT 5: 18-24s - Dust ionizes, ground scorches ---- */
fadeOut(18,'#txtLabel');
fadeUp(18.5,'#txtLabel');
tl.to('#labelKick',{textContent:'Atmosphere Ionizes',duration:0},18.5);
tl.to('#labelLine',{textContent:'Dust glows cyan, earth scorches beneath',duration:0},18.5);
fadeUp(19,'#labelLine');
// particle emission handled in render loop
look(20,540,960,1.1,1.2);
breath(18,24,1.02);

/* ---- SHOT 6: 24-29s - Shield reveals ---- */
fadeOut(24,'#txtLabel');
fadeUp(24.5,'#txtLabel');
tl.to('#labelKick',{textContent:'Mystical Shield',duration:0},24.5);
tl.to('#labelLine',{textContent:'Golden hexagonal dome contains the blast',duration:0},24.5);
fadeUp(25,'#labelLine');
// shield animation handled in render loop
look(25,540,960,1.1,1.2);
breath(24,29,1.02);

/* ---- SHOT 7: 29-34s - DETONATION (MOMEN ISTIMEWA) ---- */
fadeOut(29,'#txtLabel');
fadeUp(29.5,'#txtGlyph');
tl.to('#glyphLine',{textContent:'DETONATION',duration:0},29.5);
fadeUp(30,'#glyphLine');
// detonation handled in render loop
into(33.5,540,960,1.5); // push-through at peak
settle(33.5,540,960,1.5);
breath(29,34,1.05);

/* ---- SHOT 8: 34-39s - Impact on shield ---- */
fadeOut(34,'#txtGlyph');
fadeUp(34.5,'#txtGlyph');
tl.to('#glyphLine',{textContent:'CONTAINED',duration:0},34.5);
fadeUp(35,'#glyphLine');
home(35,1.5);
breath(34,39,1.02);

/* ---- SHOT 9: 39-44s - Rebound inward ---- */
fadeOut(39,'#txtGlyph');
fadeUp(39.5,'#txtGlyph');
tl.to('#glyphLine',{textContent:'ENERGY RETURNS',duration:0},39.5);
fadeUp(40,'#glyphLine');
breath(39,44,1.01);

/* ---- SHOT 10: 44-49s - Post-detonation calm ---- */
fadeOut(44,'#txtGlyph');
fadeUp(44.5,'#txtLabel');
tl.to('#labelKick',{textContent:'Dormant Again',duration:0},44.5);
tl.to('#labelLine',{textContent:'The weapon sleeps. The cycle resets.',duration:0},44.5);
fadeUp(45,'#labelLine');
home(45,1.5);
breath(44,49,1.01);

/* ---------- render loop (fungsi murni dari tl.time()) ---------- */
let pulsePhase=0, shieldOp=0, detProg=0, shockR=0, loopProg=0;
// particles canvas will be created in document.fonts.ready
let particlesCanvas=null, particlesCtx=null;

function renderFrame(t){
  const dt=1/30; // fixed step for determinism
  pulsePhase+=dt*2;

  /* update state machines */
  if(t>=24 && t<29) shieldOp=smooth((t-24)/5);
  else if(t>=39 && t<44) shieldOp=1-smooth((t-39)/5)*0.5;
  else if(t>=44 && t<49) shieldOp=lerp(0.5,0,smooth((t-44)/5));
  else if(t<24) shieldOp=0;
  else shieldOp=1;

  if(t>=29 && t<34) detProg=smooth((t-29)/5);
  else if(t>=34 && t<39) detProg=1;
  else if(t>=39 && t<44) detProg=1-smooth((t-39)/5);
  else detProg=0;

  if(t>=39 && t<44) shockR=lerp(0,300,smooth((t-39)/5));
  else shockR=0;

  if(t>=54) loopProg=smooth((t-54)/6);
  else loopProg=0;

  /* particle emission */
  if(t>=18 && t<24 && Math.random()<0.3){
    particles.emit(540+(Math.random()-0.5)*300, 960+(Math.random()-0.5)*200,
      {n:3,c:'var(--cyan)',spd:20,life:2,sz:1.5,grav:-10});
  }
  if(t>=29 && t<30.5){
    particles.emit(540,960,{n:60,c:'var(--bluewhite)',spd:250,spr:TAU,life:1,sz:4});
  }

  particles.update(dt);

  /* draw particles to canvas layer */
  const pctx=particlesCtx;
  pctx.clearRect(0,0,W,H);
  particles.draw(pctx);

  /* update Brahmastra visual state */
  // glyph rotation & pulse (guard for early frames)
  const shaft=$('#shaft'), tip=$('#tip'), fletch=$('#fletch'), core=$('#core'), shield=$('#shield'), shock=$('#shockwave');
  const glyphEls=$$('#glyphs path');
  if(glyphEls.length){
    const rot=pulsePhase*0.3;
    glyphEls.forEach((g,i)=>{
      const baseY=-250+i*50;
      const pulse=0.5+0.5*Math.sin(pulsePhase+i);
      g.setAttribute('transform',`translate(0,${baseY}) rotate(${rot+i*0.5}) scale(${pulse})`);
      g.setAttribute('stroke-opacity',0.7+0.3*pulse);
    });
  } else {
    // Create glyphs immediately if they don't exist (for initial render)
    for(let i=0;i<12;i++){
      const g=S('path',{d:glyphPaths[i],stroke:'var(--cyan)','stroke-width':2.5,fill:'none','stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#glyphGlow)'},$('#glyphs'));
      g.setAttribute('transform',`translate(0,${-250+i*50})`);
    }
  }
  // core pulse
  if(core) core.setAttribute('r',40*(0.6+0.4*Math.sin(pulsePhase*2)));
  // shield
  if(shield){
    shield.setAttribute('r',180);
    shield.setAttribute('opacity',shieldOp*0.5);
  }
  // shockwave
  if(shock){
    if(shockR>0){
      shock.setAttribute('r',shockR);
      shock.setAttribute('opacity',0.8*(1-shockR/500));
    }else shock.setAttribute('opacity',0);
  }
  // detonation flash
  if(detProg>0){
    const flashR=lerp(0,400,smooth(detProg));
    const flashAlpha=lerp(1,0,smooth(detProg));
    // drawn via dynamic rect in bg
  }

  /* manuscripts orbit (only after t>=8 when initialized) */
  if(t>=8){
    const mEls=$$('#manuscripts g');
    mEls.forEach((m,i)=>{
      if(i>=manuscripts.length) return;
      const prog=clamp((t-8)/5,0,1);
      const a=manuscripts[i].angle+prog*TAU*0.5;
      const r=lerp(manuscripts[i].rStart,manuscripts[i].rEnd,prog);
      const x=540+Math.cos(a)*r;
      const y=960+Math.sin(a)*r*0.6;
      m.setAttribute('transform',`translate(${x} ${y}) rotate(${manuscripts[i].rot}) scale(${lerp(1,0.8,prog)})`);
      // morph text to lines
      if(prog>0.5){
        const lines=$$('line',m);
        lines.forEach(l=>l.setAttribute('opacity',smooth((prog-0.5)*2)));
      }
    });
  }

  /* blueprints orbit (only after t>=13 when initialized) */
  if(t>=13){
    blueprints.forEach((bp,i)=>{
      const a=bp.angle+t*bp.spd;
      const x=540+Math.cos(a)*bp.r;
      const y=960+Math.sin(a)*bp.r*0.6;
      if(bp.el) bp.el.setAttribute('transform',`translate(${x} ${y})`);
    });
  }

  /* bg blob rotation (guard) */
  const blobChildren = $('#bgBlobs *');
  const blob = blobChildren && blobChildren.length > 0 ? blobChildren[0] : null;
  if(blob) blob.setAttribute('transform',`rotate(${t*0.05*57.3} 540 960)`);

  /* loop reset visual */
  if(t>54){
    // fade to initial state
  }

  /* camera already applied via GSAP ticker */
}

/* ---------- kontrol: autoplay + loop, tanpa player ---------- */
const q=new URLSearchParams(location.search),vo=$('#vo'),hasVO=!!vo.getAttribute('src');let audioOn=false;
function start(){tl.play(0);if(hasVO){vo.currentTime=0;vo.play().then(()=>audioOn=true).catch(()=>{});}}
tl.eventCallback('onComplete',()=>start());
gsap.ticker.add(()=>{if(!audioOn||tl.paused())return;if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=tl.time();});
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);applyCam();renderFrame(t);},play:start};

/* ================= FOOTAGE — layer video terikat timeline ================= */
var CLIPS = [];
function clip(el,o){o=o||{};el.muted=true;el.playsInline=true;el.preload='auto';el.loop=false;
  try{el.pause();}catch(e){}
  var c={el:el,at:o.at||0,inT:o.in||0,out:(o.out==null?null:o.out),rate:o.rate||1,hold:!!o.hold};
  (CLIPS=CLIPS||[]).push(c);return c;}
function clipTime(c,t){var end=c.out!=null?c.out:(isFinite(c.el.duration)?c.el.duration:1e9);
  var lt=(t-c.at)*c.rate;if(lt<0)return null;var vt=c.inT+lt;
  if(vt>end-1/120){if(!c.hold)return null;vt=end-1/60;}return vt;}
function syncClips(t,playing){for(var i=0;i<CLIPS.length;i++){var c=CLIPS[i],v=c.el,vt=clipTime(c,t);
  if(vt===null){if(!v.paused)v.pause();continue;}
  if(playing){if(v.playbackRate!==c.rate)v.playbackRate=c.rate;if(v.paused)v.play().catch(function(){});
    if(Math.abs(v.currentTime-vt)>.2)v.currentTime=vt;}else{if(!v.paused)v.pause();if(Math.abs(v.currentTime-vt)>1/90)v.currentTime=vt;}}}
function seekClips(t){return Promise.all(CLIPS.map(function(c){return new Promise(function(res){
  var v=c.el,vt=clipTime(c,t);try{v.pause();}catch(e){}
  if(vt===null)return res();
  var fin=function(){requestAnimationFrame(function(){requestAnimationFrame(res);});};
  if(Math.abs(v.currentTime-vt)<1/240&&v.readyState>=2)return fin();
  var to=setTimeout(res,4000);
  v.addEventListener('seeked',function h(){v.removeEventListener('seeked',h);clearTimeout(to);fin();});
  v.currentTime=vt;});}));}
document.fonts.ready.then(()=>{
  console.log('[FONTS] fonts.ready callback executing');
  try {
    console.log('[FONTS] About to create particles canvas');
    // Create particles canvas now that DOM is ready
    const stageEl = $('#stage');
    console.log('[FONTS] Stage element:', !!stageEl);
    if (!stageEl) {
      console.error('[FONTS] Stage element not found!');
      return;
    }
    const canvas = (function(){const c=document.createElement('canvas');c.width=W;c.height=H;c.style.position='absolute';c.style.left='0';c.style.top='0';c.style.pointerEvents='none';c.style.zIndex='10';stageEl.appendChild(c);return c;})();
    console.log('[FONTS] canvas created:', !!canvas);
    particlesCanvas = canvas;
    window.particlesCanvas = canvas;
    particlesCtx = canvas.getContext('2d');
    window.particlesCtx = particlesCtx;
    console.log('[FONTS] particles canvas created, ctx:', !!particlesCtx, 'window.particlesCanvas:', !!window.particlesCanvas);

    console.log('[FONTS] About to call renderFrame(0)');
    try {
      renderFrame(0);
      console.log('[FONTS] renderFrame(0) done');
    } catch(e) {
      console.error('[FONTS] Error in renderFrame(0):', e.message, e.stack);
    }
    window.OPENTER_READY = true;
    window.OPENTER.ready=true;window.OPENTER.clipsReady=function(){return true;};
    console.log('[FONTS] OPENTER.ready = true');
    document.dispatchEvent(new CustomEvent('opener-ready'));
    if(q.has('clean'))return;
    if(!hasVO){start();return;}
    console.log('[FONTS] About to play audio');
    vo.play().then(()=>{audioOn=true;vo.currentTime=0;tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});

    // Start clip sync after OPENER is ready
    gsap.ticker.add(function(){if(CLIPS.length)syncClips(window.OPENER.tl.time(),!window.OPENER.tl.paused());});

    // Start render loop - try both setTimeout AND delayedCall for redundancy
    console.log('[FONTS] Using setTimeout for renderFrame');
    try {
      setTimeout(() => {
        console.log('[FONTS] setTimeout fired, adding renderFrame to ticker');
        gsap.ticker.add(()=>renderFrame(tl.time()));
        console.log('[FONTS] renderFrame added to ticker via setTimeout');
      }, 500);
      console.log('[FONTS] setTimeout scheduled');
    } catch(e) {
      console.error('[FONTS] Error scheduling setTimeout:', e.message, e.stack);
    }

    // Also try delayedCall
    console.log('[FONTS] Using gsap.delayedCall for renderFrame (backup)');
    try {
      gsap.delayedCall(0.5, () => {
        console.log('[FONTS] delayedCall fired, adding renderFrame to ticker');
        gsap.ticker.add(()=>renderFrame(tl.time()));
        console.log('[FONTS] renderFrame added to ticker via delayedCall');
      });
      console.log('[FONTS] delayedCall scheduled');
    } catch(e) {
      console.error('[FONTS] Error scheduling delayedCall:', e.message, e.stack);
    }

    // Also set a watchdog to check if ticker is running
    console.log('[FONTS] Setting up ticker watchdog');
    let tickCount = 0;
    const watchdog = () => {
      tickCount++;
      if (tickCount === 1) {
        console.log('[WATCHDOG] First tick detected, ticker is running');
      }
      if (tickCount === 2) {
        console.log('[WATCHDOG] Second tick detected, ticker active');
      }
    };
    gsap.ticker.add(watchdog);
    console.log('[FONTS] Watchdog added to ticker');

    if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
      gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
      sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
      sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
  } catch(e) {
    console.error('[FONTS] Error in fonts.ready callback:', e);
  }
}).catch(e => console.error('[FONTS] fonts.ready promise rejected:', e));
